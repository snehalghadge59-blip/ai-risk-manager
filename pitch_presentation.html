<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SentinelRisk AI - 5-Minute Pitch Presentation</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #090d16;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      max-width: 960px;
      width: 92%;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 26px;
      color: #fff;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      margin: 0 0 20px 0;
    }
    .video-box {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      border: 1px solid #334155;
      aspect-ratio: 16 / 9;
    }
    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .btn {
      background: #6366f1;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #4f46e5;
    }
    .btn-emerald {
      background: #10b981;
    }
    .btn-emerald:hover {
      background: #059669;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>SentinelRisk AI — Razorpay AI Builder Pitch Video</h1>
  <p>Universal HD Pitch Video (100% Synced Audio & HD Slide Presentation)</p>

  <div class="video-box">
    <video controls autoplay loop poster="slide1.png">
      <source src="sentinelrisk_ai_pitch_video.mp4" type="video/mp4">
      Your browser does not support playing this MP4 video natively.
    </video>
  </div>

  <div class="controls">
    <button className="btn" onclick="document.querySelector('video').play()">▶ Play Pitch Video</button>
    <a href="sentinelrisk_ai_pitch_video.mp4" download="sentinelrisk_ai_pitch_video.mp4" class="btn btn-emerald">
      ⬇️ Download HD Pitch Video (.MP4)
    </a>
    <a href="sentinelrisk_female_jenny.mp3" download="sentinelrisk_female_jenny.mp3" class="btn" style="background:#334155;">
      🎵 Download Audio Voiceover (.MP3)
    </a>
  </div>
</div>

</body>
</html>
